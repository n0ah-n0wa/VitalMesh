# OpenTelemetry Collector for local development.
#
# Both services export OTLP over HTTP to this collector. It is the piece
# that makes tracing observable locally without running a trace store: the
# debug exporter prints each trace, so `docker compose logs otel-collector`
# shows a request crossing the gateway and the processor.
#
# A real trace store plugs in by adding one exporter and naming it in the
# traces pipeline; nothing about the services changes, which is the point of
# exporting to a collector rather than to a backend directly.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Bounded memory: a collector that is sent more than it can handle sheds
  # load rather than growing until it is killed.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # `basic` prints one line per span; `detailed` prints every attribute,
  # which is what to use when checking that a span carries what it should
  # and nothing it should not.
  debug:
    verbosity: basic

service:
  # The collector's own metrics, scraped by Prometheus. They answer "is
  # tracing working" without a trace store: accepted, refused and failed
  # span counts.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
