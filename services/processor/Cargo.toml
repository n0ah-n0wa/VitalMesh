[package]
name = "processor"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "VitalMesh data processing service"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip makes parsing correctly rounded, so a finite f64 survives a
# JSON round trip bit-for-bit (the default parser can be off by one ULP).
serde_json = { version = "1", features = ["float_roundtrip"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
