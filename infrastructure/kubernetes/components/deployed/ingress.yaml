# The public entry point. Only the gateway is exposed; the processor is an
# internal service and has no Ingress in any environment (section 8).
#
# Served by an Application Load Balancer through the AWS Load Balancer
# Controller (infrastructure/kubernetes/platform), which is what the
# annotations below address. The host is a placeholder every overlay must
# replace: it is under `.invalid`, which RFC 2606 reserves to never resolve,
# so an overlay that forgets to patch it produces an Ingress that visibly
# matches nothing rather than one that quietly claims a real name.
#
# TLS: the `tls` block names the host and no Secret. The controller finds
# the ACM certificate issued for that host (by the Terraform in
# infrastructure/terraform, modules/platform/tls.tf) and terminates TLS on
# the load balancer; no certificate or key ever enters the cluster. Port 80
# is open only to redirect to 443.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitalmesh-api-gateway
  namespace: vitalmesh
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: vitalmesh
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Pods are the targets, addressed directly by their VPC address, so a
    # request goes load balancer -> pod with no node hop and no NodePort.
    # It also means the load balancer connects from the public subnets,
    # which the overlay's NetworkPolicy admits by range.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # The same question the readiness probe asks, so the load balancer and
    # Kubernetes agree on which pods may take traffic.
    alb.ingress.kubernetes.io/healthcheck-path: /ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Drop requests carrying headers that are not valid HTTP, before they
    # reach the gateway; and an idle timeout well above the gateway's own.
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true,idle_timeout.timeout_seconds=60
    # Deregistration waits no longer than the pods' own termination grace,
    # so a rolling update is not paced by the load balancer.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - must-be-set-by-overlay.invalid
  rules:
    - host: must-be-set-by-overlay.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vitalmesh-api-gateway
                port:
                  name: http
