# The base admits gateway traffic only from a namespace labelled
# vitalmesh.io/gateway-client=true, and nothing carries that label by
# default. In a deployed environment the traffic comes from an Application
# Load Balancer, which is not a pod and has no namespace: it connects from
# the VPC's public subnets, so it is admitted by address range, and the
# ranges differ per environment. This patch therefore only restates the
# label rule; each overlay's networkpolicy-ingress.yaml adds its own
# ranges, which must match the public_subnet_cidrs output of that
# environment's Terraform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
  namespace: vitalmesh
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              vitalmesh.io/gateway-client: "true"
      ports:
        - protocol: TCP
          port: 8080
