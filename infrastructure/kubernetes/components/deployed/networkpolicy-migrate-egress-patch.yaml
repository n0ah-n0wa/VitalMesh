# The migration Job's egress, narrowed like the other two.
#
# It reaches PostgreSQL and nothing else. In a deployed environment the
# database is inside the VPC, so there is no reason for a migration to be
# able to open a connection to a public address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: vitalmesh
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 5432
