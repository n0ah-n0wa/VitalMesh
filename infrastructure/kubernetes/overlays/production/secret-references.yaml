# Where production's credentials come from.
#
# Section 104 requires production to use separate secrets, and section 31
# forbids any of them appearing in git. The shared component removed the
# base's empty placeholders, so nothing here creates a Secret and no value
# is committed — these patches only change which name each service reads.
#
# The named Secrets are expected to be materialised in the cluster by a
# secrets operator syncing from AWS Secrets Manager, which is the
# recommended default in OQ-37 and is still open. Whatever closes it, the
# contract is the same: an object of this name carrying these keys exists
# in the namespace before the Deployment rolls, and nothing in this
# repository ever knows its contents.
#
# The keys are unchanged from the base — DATABASE_URL, JWT_SECRET,
# PROCESSOR_TOKEN and REDIS_URL for the gateway, INTERNAL_TOKEN for the
# processor — and with ENVIRONMENT=production, start-up refuses a
# DATABASE_URL without TLS and a REDIS_URL that is not rediss://.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalmesh-api-gateway
  namespace: vitalmesh
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-production
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-production
                  key: JWT_SECRET
            - name: PROCESSOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-production
                  key: PROCESSOR_TOKEN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-production
                  key: REDIS_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalmesh-processor
  namespace: vitalmesh
spec:
  template:
    spec:
      containers:
        - name: processor
          env:
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-processor-production
                  key: INTERNAL_TOKEN
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vitalmesh-migrate
  namespace: vitalmesh
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-production
                  key: DATABASE_URL
