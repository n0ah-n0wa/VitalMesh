# Where this environment's credentials come from.
#
# The shared component removed the base's empty placeholder Secrets, so
# nothing here creates a Secret and no value is committed. These patches
# only change which name each service reads, and the Secret itself is
# created out of band — for staging, by the deployment pipeline from its
# own CI secret store:
#
#   kubectl -n vitalmesh-staging create secret generic vitalmesh-api-gateway-staging \
#     --from-literal=DATABASE_URL=... --from-literal=JWT_SECRET=... \
#     --from-literal=PROCESSOR_TOKEN=... --from-literal=REDIS_URL=...
#
# The names carry the environment even though the namespace already
# separates them. Two reasons: a Secret's name is what appears in an
# audit log and in an external secret manager's mapping, and a name that
# says which environment it belongs to makes a mis-scoped credential
# visible at a glance rather than only from context.
#
# Section 104 requires production to use separate secrets; this is the
# staging half of keeping them separate everywhere, so that production is
# not the first environment where the pattern is tried.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalmesh-api-gateway
  namespace: vitalmesh
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-staging
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-staging
                  key: JWT_SECRET
            - name: PROCESSOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-staging
                  key: PROCESSOR_TOKEN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-staging
                  key: REDIS_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalmesh-processor
  namespace: vitalmesh
spec:
  template:
    spec:
      containers:
        - name: processor
          env:
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-processor-staging
                  key: INTERNAL_TOKEN
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vitalmesh-migrate
  namespace: vitalmesh
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vitalmesh-api-gateway-staging
                  key: DATABASE_URL
