# Where staging's load balancer connects from: the two public subnets of
# the 10.20.0.0/16 VPC (infrastructure/terraform/environments/staging,
# output public_subnet_cidrs). A strategic merge replaces the whole ingress
# list, so the label rule from the base is restated here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
  namespace: vitalmesh
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              vitalmesh.io/gateway-client: "true"
        - ipBlock:
            cidr: 10.20.0.0/24
        - ipBlock:
            cidr: 10.20.1.0/24
      ports:
        - protocol: TCP
          port: 8080
