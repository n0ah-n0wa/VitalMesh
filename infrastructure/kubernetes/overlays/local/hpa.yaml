# One replica, two at most. A single-node kind cluster has nowhere to put
# a second, and the point here is that the manifests apply and the system
# works — not that it scales.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vitalmesh-api-gateway
  namespace: vitalmesh
spec:
  minReplicas: 1
  maxReplicas: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vitalmesh-processor
  namespace: vitalmesh
spec:
  minReplicas: 1
  maxReplicas: 2
