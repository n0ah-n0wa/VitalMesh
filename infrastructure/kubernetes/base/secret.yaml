# Secret templates. These carry no values, and they never will in this
# repository: section 31 forbids committing a password, a JWT secret, a
# database credential or an API token, and a placeholder that looks like a
# value is the thing most likely to reach production unchanged.
#
# What is committed is the shape — which keys each service requires — so
# that a missing one is a review comment rather than a discovery at
# rollout. The values come from outside git:
#
#   kubectl -n vitalmesh create secret generic vitalmesh-api-gateway \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/db?sslmode=verify-full' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=PROCESSOR_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_URL='rediss://:pass@host:6379'
#
# or, in an overlay, from a kustomize secretGenerator reading a file git
# ignores, or from a secrets operator that syncs the value from AWS Secrets
# Manager. Which of those is used in production is still open (OQ-37); all
# three replace this object rather than editing it.
#
# Applying the base as it stands creates these two Secrets empty. Every
# secretKeyRef below is required, so the kubelet refuses to start the
# container and says which key it could not find. That is the intended
# behaviour: a deployment missing its credentials must fail where someone
# is looking, not start with a default one.
---
apiVersion: v1
kind: Secret
metadata:
  name: vitalmesh-api-gateway
  namespace: vitalmesh
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: vitalmesh
  annotations:
    # Read by people, not by Kubernetes. It marks this object as a shape
    # with no contents, so that a `kubectl get secret -o yaml` showing
    # nothing is understood as intended rather than as damage.
    vitalmesh.io/placeholder: "values are supplied at deploy time, never from git"
type: Opaque
# Required keys, all of which the gateway reads at start-up:
#
#   DATABASE_URL     PostgreSQL URL including credentials. In this
#                    environment (ENVIRONMENT=production) sslmode must be
#                    require, verify-ca or verify-full; start-up refuses a
#                    plaintext connection.
#   JWT_SECRET       HMAC key for access tokens, at least 32 bytes.
#   PROCESSOR_TOKEN  Bearer token presented to the processor. Must equal
#                    the processor's INTERNAL_TOKEN below, or every
#                    dispatch is rejected with 401.
#   REDIS_URL        Redis URL including credentials. It must use rediss://
#                    here: with ENVIRONMENT=production, start-up refuses a
#                    plaintext redis:// (section 30). Rate limiting,
#                    caching and the idempotency lock use it and degrade
#                    without it, so the key is required rather than left
#                    to chance — a gateway that quietly falls back to
#                    per-replica rate limiting is worse than one that
#                    refuses to start.
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: vitalmesh-processor
  namespace: vitalmesh
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/component: processor
    app.kubernetes.io/part-of: vitalmesh
  annotations:
    vitalmesh.io/placeholder: "values are supplied at deploy time, never from git"
type: Opaque
# Required key:
#
#   INTERNAL_TOKEN   The other half of the gateway's PROCESSOR_TOKEN. At
#                    least 16 characters, and required outside local
#                    development. The two must be generated together and
#                    rotated together.
data: {}
