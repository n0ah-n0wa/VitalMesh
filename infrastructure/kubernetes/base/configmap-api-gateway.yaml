# Non-secret configuration for the gateway. Anything carrying a credential
# is in the Secret instead, including DATABASE_URL and REDIS_URL, which
# embed one in the URL.
#
# This is not the whole of the gateway's configuration. The service has a
# safe default for every value here (services/api-gateway/README.md lists
# them all); what is written out is the set that either differs from the
# default, or that another object in this directory is derived from. A
# number that a probe timeout or a memory limit depends on belongs where a
# reader can see it, not left implicit in a binary.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vitalmesh-api-gateway
  namespace: vitalmesh
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: vitalmesh
data:
  # The base defaults to the strictest environment on purpose. `production`
  # makes start-up refuse a plaintext database connection and refuse a
  # missing PROCESSOR_TOKEN; `local` permits both. An overlay that forgets
  # to set this therefore gets the safe answer, and relaxing it has to be
  # written down in the overlay that wants it relaxed.
  ENVIRONMENT: "production"

  # Explicit because a container must listen on every interface to be
  # reachable from outside its network namespace. The service's own default
  # already does, but a value the Service and the probes depend on is worth
  # stating.
  HTTP_ADDR: ":8080"

  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # In-cluster DNS for the processor Service. Scheme and host only, which is
  # what the gateway accepts.
  PROCESSOR_URL: "http://vitalmesh-processor:8081"

  # Read together with terminationGracePeriodSeconds in the Deployment: the
  # kubelet allows the grace period, the process allows this, and the first
  # must be the larger of the two or SIGKILL arrives mid-request.
  HTTP_SHUTDOWN_TIMEOUT: "10s"

  # The whole /ready evaluation is bound by this, so the readiness probe's
  # timeoutSeconds is set above it. A probe that gives up before the check
  # does would report a failure the service never had.
  READINESS_TIMEOUT: "2s"

  # Section 29's limits, written out because they are policy rather than
  # implementation: someone will want to change these without reading Go.
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW: "1m"
  RATE_LIMIT_ANONYMOUS: "60"
  RATE_LIMIT_AUTHENTICATED: "300"
  RATE_LIMIT_ADMIN: "1000"

  # These two decide the pod's memory ceiling and are the reason its limit
  # is what it is. Argon2id allocates PASSWORD_HASH_MEMORY_KIB for the
  # duration of each hash, and PASSWORD_HASH_MAX_CONCURRENT of them may run
  # at once: 4 x 64 MiB = 256 MiB of password hashing alone. Lower either
  # one and the Deployment's memory limit can come down with it; raise
  # either and it must go up first.
  PASSWORD_HASH_MEMORY_KIB: "65536"
  PASSWORD_HASH_MAX_CONCURRENT: "4"

  # How far back through X-Forwarded-For the client address may be taken.
  # Zero means the address is taken from the connection, which is correct
  # until something in front of the gateway is known to rewrite the header.
  # An overlay that puts an ingress in front must raise this to the number
  # of proxies it adds, or rate limiting will count every caller as one.
  TRUSTED_PROXY_HOPS: "0"

  # OTEL_EXPORTER_OTLP_ENDPOINT is deliberately absent. Where traces go is a
  # property of the environment, and with no endpoint the service still
  # propagates trace context and logs trace ids, exporting nothing. An
  # overlay sets it; nothing here breaks without it.
