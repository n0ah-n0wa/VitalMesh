# One service account per service, so that a permission granted to one is
# never inherited by the other. Neither is the namespace default, which
# every pod without an explicit account would otherwise share.
#
# automountServiceAccountToken is false on both. Neither service talks to
# the Kubernetes API, so a token mounted into the pod is credential material
# with no purpose: it can only be stolen, never used. The pod specs repeat
# the setting, because the pod-level field is the one that decides and
# stating it there keeps the answer next to the question.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vitalmesh-api-gateway
  namespace: vitalmesh
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: vitalmesh
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vitalmesh-processor
  namespace: vitalmesh
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/component: processor
    app.kubernetes.io/part-of: vitalmesh
automountServiceAccountToken: false
