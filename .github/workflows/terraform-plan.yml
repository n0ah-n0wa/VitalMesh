# A real `terraform plan` for both environments, against the AWS account,
# on every pull request and push that touches the Terraform.
#
# Authentication is GitHub's OIDC token exchanged for the read-only
# vitalmesh-terraform-plan role (infrastructure/terraform/bootstrap/github.tf):
# no AWS key exists anywhere. The role trusts exactly two subjects, this
# repository's pull requests and its main branch, and can read
# configuration and state but never data (log contents, secret values,
# objects outside the state bucket) and never write anything but the state
# lock. Nothing here can change infrastructure; applying is a person's job.
#
# The account-specific inputs are repository variables, not files:
# docs/GITHUB_CONFIGURATION.md lists them. Until they are set the job is
# skipped with a notice rather than failed, so a fork or a fresh clone is
# not red for want of an account.
name: Terraform plan

on:
  pull_request:
    paths:
      - infrastructure/terraform/**
      - .github/workflows/terraform-plan.yml
  push:
    branches: [main]
    paths:
      - infrastructure/terraform/**
      - .github/workflows/terraform-plan.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  not-configured:
    name: not configured
    if: vars.AWS_ACCOUNT_ID == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "::notice title=Terraform plan skipped::The repository variable AWS_ACCOUNT_ID is not set, so there is no account to plan against. docs/GITHUB_CONFIGURATION.md lists what to configure."

  # The plan role trusts pull requests and main; a manual run from another
  # branch would be refused by STS. Say so first.
  wrong-branch:
    name: wrong branch
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "::error::A manual Terraform plan runs from main only (this is ${{ github.ref }}); open a pull request to plan a branch."
          exit 1

  plan:
    name: plan ${{ matrix.environment }}
    if: vars.AWS_ACCOUNT_ID != '' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The OIDC token, and nothing else.
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the plan role through OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vitalmesh-terraform-plan
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Who this run is, as CloudTrail will record it.
      - name: Identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      # The per-environment values (account ID, admin ARNs, allowed CIDRs,
      # domain) are a repository variable holding the tfvars text: not
      # secrets, but not committed either, since they belong to one account.
      - name: Environment values
        env:
          TF_VARS: ${{ vars[format('TF_VARS_{0}', matrix.environment == 'staging' && 'STAGING' || 'PRODUCTION')] }}
        run: |
          if [ -z "$TF_VARS" ]; then
            echo "::error::Repository variable TF_VARS_${{ matrix.environment == 'staging' && 'STAGING' || 'PRODUCTION' }} is not set; see docs/GITHUB_CONFIGURATION.md"
            exit 1
          fi
          printf '%s\n' "$TF_VARS" > terraform.tfvars

      - name: terraform init
        run: |
          terraform init -lockfile=readonly -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=5m 2>&1 | tee plan.txt
          {
            echo "## terraform plan: ${{ matrix.environment }}"
            echo
            echo '```'
            # The summary line, then the change list; the full output is in the log.
            grep -E '^(Plan:|No changes|  # )' plan.txt | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
