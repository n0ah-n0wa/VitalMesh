name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitalmesh
          POSTGRES_PASSWORD: vitalmesh
          POSTGRES_DB: vitalmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitalmesh -d vitalmesh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://vitalmesh:vitalmesh@localhost:5432/vitalmesh?sslmode=disable
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: services/api-gateway/go.mod
          cache-dependency-path: services/api-gateway/go.mod

      - name: Install Rust toolchain pinned in rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' services/processor/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"

      - run: make verify
