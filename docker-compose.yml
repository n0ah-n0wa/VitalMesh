# Local infrastructure. Application services join this file as they gain
# container images (see docs/IMPLEMENTATION_PLAN.md, Phase 2).
#
#   docker compose up -d --wait postgres redis
#
# The credentials below are for local development only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitalmesh
      POSTGRES_PASSWORD: vitalmesh
      POSTGRES_DB: vitalmesh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalmesh -d vitalmesh"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Ephemeral shared state only: rate-limit counters, short-lived cache
  # entries and idempotency locks (SPECIFICATIONS.md section 23). Nothing
  # here is a record of truth, so no volume is mounted and losing the
  # container loses nothing that matters.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
